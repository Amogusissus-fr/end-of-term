<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
 
    <link rel="stylesheet" href="/Login/login.css">
    <script
    src="https://kit.fontawesome.com/b25957ae4f.js"
    crossorigin="anonymous"
  ></script>

</head>
<body>
    <form action="/Homepage/home.html">
        <h3>Login Here</h3>
    
        <label for="username">Username</label>
        <input type="text" placeholder="Email or Phone" id="usernameLogin">
    
        <label for="password">Password</label>
        <input type="password" placeholder="Password" id="passwordLogin">
        
    
        <button type="button" class="LoginBtn">Log In</button>
        <button type="button" class="RedirectRegister">Register</button>

        <div class="social">
            <div class="go">
                <i class="fa fa-google"></i> Google
            </div>
            <div class="fb">
                <i class="fa fa-facebook"></i> Facebook
            </div>

        </div>
    </form>

    <script src="/Login/login.js"></script>
</body>
</html>
